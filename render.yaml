services:
  - type: web
    name: jarvis-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_RATE_WINDOW_MS
        value: "60000"
      - key: API_RATE_MAX
        value: "60"

services:
  - type: web
    name: jarvis-ai-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JARVIS_DIAGNOSTICS_TOKEN
        sync: false

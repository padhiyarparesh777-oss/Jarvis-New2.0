name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
      CAPGO_APP_ID: ${{ secrets.CAPGO_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (sync package lock for OTA plugin)
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Automated regression tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Publish web bundle to Capgo (optional)
        if: ${{ env.CAPGO_API_KEY != '' && env.CAPGO_APP_ID != '' }}
        run: npx @capgo/cli@latest bundle upload "$CAPGO_APP_ID" --path ./dist --channel production --apikey "$CAPGO_API_KEY" --auto-bump patch --delta

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

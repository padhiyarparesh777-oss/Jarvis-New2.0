name: Tittu Super Tools MCP CI

on:
  push:
    branches:
      - feature/tittu-super-tools-mcp
    paths:
      - "tittu-super-tools/**"
      - ".github/workflows/tittu-super-tools-ci.yml"
  pull_request:
    paths:
      - "tittu-super-tools/**"
      - ".github/workflows/tittu-super-tools-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tittu-super-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tittu-super-tools/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
